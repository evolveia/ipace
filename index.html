    <script>
      // Suppress benign Vite HMR WebSocket closing errors in iframe/preview environment
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.indexOf('WebSocket') !== -1 || e.filename && e.filename.indexOf('@vite/client') !== -1)) {
          e.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && (String(e.reason.message || e.reason).indexOf('WebSocket') !== -1)) {
          e.preventDefault();
        }
      });
    </script>
